[package]
name = "pico-sakubun"
version = "0.1.0"
description = "ぴこぴこ作文帳 — Japanese homework editor"
authors = ["Fredrik"]
edition = "2021"
rust-version = "1.90"

[lib]
name = "pico_sakubun_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
lindera = { version = "6.2.0", default-features = false, features = ["embed-ipadic"] }
reqwest = { version = "0.13.5", default-features = false, features = ["native-tls"] }
tauri = { version = "2.12.5", features = [] }
tauri-plugin-dialog = "2.8.4"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
